# dshl.toml — DeepSeek Harness Launcher configuration.
# The launcher reloads this file on every start; every field is optional.

# Mirror policy for domestic (CN) mirrors.
#   off   = never use mirrors
#   on    = use a mirror when its address is non-empty (default)
#   force = always use mirrors, never fall back to the original source
auto-mirror = "on"

[mirrors]
# npm registry — package installs AND the bun/nub runtime binaries install
# from here.
npm = "http://registry.npmmirror.com"
# cargo sparse index (used temporarily for `cargo install fnm`).
cargo = "sparse+https://rsproxy.cn/index/"
# Base URL for downloading Node releases (fnm/nvm).
nodejs-release = "https://mirrors.aliyun.com/nodejs-release/"
# GitHub proxy prefix for release downloads that still come from github
# (fnm's release zip). Empty = reach github directly.
github = "https://gh-proxy.org/"

[dsh]
# Flags forwarded to dsh (boot the web profile on an ephemeral port).
flags = "--profile web --host 127.0.0.1 --port 0"
# Package manager used to install @deepseek-ai/dsh into dshl's cache:
# nub / npm / bun / pnpm. (nub installs @nubjs/nub from npm - mirrorable;
#   bun/pnpm are auto-installed when chosen as the pm.)
pm = "nub"
# Version suffix for @deepseek-ai/dsh. "latest" (default) = no suffix (and,
# with auto-update on, a registry check on every start). A pinned version
# like "0.1.0-rc.7" skips the network entirely.
version = "latest"
# Where dsh comes from:
#   global  = strictly the global dsh on your PATH; error if missing
#   hybrid  = prefer the global dsh, install into dshl's cache when absent
#             or the pinned version does not match (default)
#   private = always dshl's private cache install, never touch the global env
mode = "hybrid"
# Keep @deepseek-ai/dsh up-to-date automatically.
#   true  = when `version` is "latest", check for a newer release and update
#   false = use the installed / cached version, never update
auto-update = true
# Only allow one dsh instance on this machine.
#   false (default) = every dshl process runs its own dsh (multi-instance)
#   true            = refuse to start dsh when another dsh is already running
#                     (started manually or by another dshl), to prevent two
#                     processes writing the same session log
single-instance = false

[ui]
# Preferred window backend (always falls back to the other if unavailable).
#   webview = prefer embedded WebView, then external browser (default)
#   browser = prefer external browser, then embedded WebView
mode = "webview"
# Close to the system tray instead of exiting (Windows / Linux / macOS).
#   false          = closing the window exits the launcher and stops dsh
#   true (default) = closing hides to tray, dsh keeps running in the
#                    background; restore from the tray icon, quit via its
#                    menu (or Ctrl+C in a console build).
close-to-tray = true
# Only allow one dshl instance on this machine (launcher-level mutex,
# separate from the [dsh] single-instance option which guards dsh).
#   false          = every dshl process runs independently
#   true (default) = a second dshl does not start; it activates the
#                    existing instance instead (restore from tray if
#                    hidden, or focus its window if visible)
single-instance = true

[update]
# How the launcher handles updates of ITSELF (dsh's own updates are governed
# by [dsh] auto-update above):
#   off    = never check
#   notify = check and show that a newer launcher exists; the download happens
#            only when you click "更新启动器" (default)
#   auto   = check and download automatically
# Whatever the mode: a downloaded update is applied at the START of the next
# dshl run, before any child process exists. It never swaps the program under
# a live dsh session (that would either kill dsh or leave it unsupervised), so
# updating the launcher cannot interrupt a running session; the startup page
# shows "已下载，下次启动应用" until then.
self = "notify"
# How often to check for a launcher update, in hours (0 = timer off, the
# manual check still works). Clamped to 1..=168.
interval-hours = 6
