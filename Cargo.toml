[package]
name = "dshl"
version = "0.1.0"
edition = "2024"
description = "DeepSeek Harness web launcher — a webui.me wrapper that checks the runtime, installs dsh if needed, boots `dsh web`, and routes the browser to it."
license = "MIT"
readme = "README.md"
repository = "https://github.com/hibays/dsh-launcher"
keywords = ["deepseek", "harness", "webui", "launcher", "dsh"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
# webui.me GUI wrapper (C library is fetched by its build script).
# The upstream crate is named `webui-rs`; we rename it to `webui` so the code
# reads `webui::webui` exactly as the requested dependency line intends.
webui = { git = "https://github.com/webui-dev/rust-webui/", branch = "main", package = "webui-rs" }
# dshl.toml configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
# capture the URL that `dsh web` prints on stdout
regex = "1"
# WebSocket handshake key encoding (keep-alive client)
base64 = "0.23"
# SIGINT/SIGTERM handling so the launcher can clean up dsh on exit
ctrlc = { version = "3", features = ["termination"] }

# setsid() for detaching the dsh child on unix (thin FFI, not a runtime)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows system APIs (Win32). windows-rs 0.62 replaces the hand-written
# `#[link] extern "system"` FFI blocks that platform/ used to carry.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS status-bar (tray) icon via the native AppKit backend of tray-icon
# (no hand-written objc FFI). The tray icon is embedded as raw RGBA (32x32,
# generated by ffmpeg from assets/dsh-black.svg) so no image crate is needed.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.24"

# Embed the Windows .exe icon (resource) — see build.rs.
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
