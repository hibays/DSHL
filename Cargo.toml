[package]
name = "dshl-core"
version.workspace = true
edition.workspace = true
description = "DeepSeek Harness web launcher core — a webui.me wrapper that checks the runtime, installs dsh if needed, boots `dsh web`, and routes the browser to it."
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[workspace]
resolver = "3"
members = [".", "crates/dshl", "crates/dshl-native"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hibays/dsh-launcher"
keywords = ["deepseek", "harness", "webui", "launcher", "dsh"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
# webui.me GUI wrapper (C library is fetched by its build script).
# The upstream crate is named `webui-rs`; we rename it to `webui` so the code
# reads `webui::webui` exactly as the requested dependency line intends.
# We use our fork (hibays/rust-webui) which fixes two upstream build breaks:
#   - aarch64-linux: FFI types hardcoded to i8 while c_char is u8 there;
#   - macOS: build.rs never emits `-framework WebKit`, so WKWebView symbols
#     are undefined at link time (the framework link is added in build.rs).
webui = { git = "https://github.com/hibays/rust-webui/", branch = "main", package = "webui-rs" }
# dshl.toml configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
# capture the URL that `dsh web` prints on stdout
regex = "1"
# WebSocket handshake key encoding (keep-alive client)
base64 = "0.23"
# Async runtime — minimal tokio: only the features actually used (process I/O,
# timers, the keep-alive socket, fs handle conversion and the multi-thread rt).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "io-util",
    "sync",
    "net",
    "fs",
] }
# i18n: translations embedded at compile time (t! macro), runtime set_locale.
rust-i18n = "4"
# OS UI-language detection (used to pick the default locale at startup).
sys-locale = "0.3"

# setsid() for detaching the dsh child on unix (thin FFI, not a runtime)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows system APIs (Win32). windows-rs 0.62 replaces the hand-written
# `#[link] extern "system"` FFI blocks that platform/ used to carry.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS status-bar (tray) icon via the native AppKit backend of tray-icon
# (no hand-written objc FFI). The tray icon is embedded as raw RGBA (32x32,
# generated by ffmpeg from assets/dsh-black.svg) so no image crate is needed.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.24"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
