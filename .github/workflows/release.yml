name: Release (Track A)

on:
  push:
    tags:
      - 'v*'

concurrency:
  # A same-tag re-run replaces the in-flight one; different tags never clash.
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Track A: standalone installer artifacts (.exe / .deb / .dmg / portable zip).
# The dshl binary is built from `crates/dshl` and bundles the full kernel.
# Native plugin artifacts (.node) and npm packages are handled by
# release-native.yml and release-plugins.yml respectively.

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            ext: .exe
            family: windows
          # Native Windows ARM64 build — webui-rs is now a git source
          # dependency (no more prebuilt C library), so aarch64-pc-windows-msvc
          # compiles cleanly on the windows-11-arm hosted runner. The default
          # host triple on this runner IS aarch64-pc-windows-msvc, so no
          # `targets:` argument is needed below.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: windows-aarch64
            ext: .exe
            family: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            ext: ""
            family: linux
            deb_arch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            ext: ""
            family: linux
            deb_arch: arm64
          # Cross-compiled on the arm64 runner (Xcode ships universal SDKs).
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            ext: ""
            family: macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            ext: ""
            family: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compiling Linux aarch64 needs a cross linker + libc headers.
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # cc-rs needs the cross compiler for webui's C library, not just the
          # linker — without this the linux-aarch64 leg dies at first tag.
          echo "CC_AARCH64_UNKNOWN_LINUX_GNU=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_AARCH64_UNKNOWN_LINUX_GNU=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"

      - name: Resolve version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build dshl binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p dshl

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/dshl${{ matrix.ext }}"
          bash scripts/package.sh stage --bin "$BIN"

      - name: Package zip
        shell: bash
        run: bash scripts/package.sh portable --zip "dshl-${{ matrix.artifact }}.zip"

      - name: Install NSIS (Windows installer)
        if: matrix.family == 'windows'
        shell: pwsh
        # On windows-11-arm we download the official NSIS 3.10 zip (NSIS ships
        # a portable x86 build that runs under WoW64 emulation on ARM64
        # Windows). choco on ARM64 is unreliable for NSIS specifically.
        # windows-latest (x64) keeps using choco as before.
        run: |
          if ($env:RUNNER_OS -eq 'Windows' -and $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') {
            # ARM64 host (windows-11-arm): the official NSIS zip ships a
            # portable x86 build that runs under WoW64 emulation. The old
            # Is64BitProcess probe could not actually tell the hosts apart.
            $ErrorActionPreference = 'Stop'
            $ProgressPreference = 'SilentlyContinue'
            $url = 'https://prdownloads.sourceforge.net/nsis/nsis-3.10.zip'
            # pwsh's Invoke-WebRequest fails to load its web cmdlet assembly on the
  # ARM64 runner (GAC/OperationStopped) - curl.exe ships with the OS image.
  curl.exe -LsS -o nsis.zip $url
            Expand-Archive -Path nsis.zip -DestinationPath C:\nsis -Force
            Remove-Item nsis.zip
            Add-Content $env:GITHUB_PATH 'C:\nsis\nsis-3.10'
            Write-Host 'NSIS 3.10 installed at C:\nsis\nsis-3.10'
          } else {
            choco install nsis -y --no-progress
          }

      - name: Package Windows installer (NSIS)
        if: matrix.family == 'windows'
        shell: bash
        run: bash scripts/package.sh nsis --version "$VERSION" --artifact "${{ matrix.artifact }}"

      - name: Package Linux installer (.deb)
        if: matrix.family == 'linux'
        shell: bash
        run: bash scripts/package.sh deb --version "$VERSION" --deb-arch "${{ matrix.deb_arch }}"

      - name: Package macOS installer (.dmg)
        if: matrix.family == 'macos'
        shell: bash
        run: bash scripts/package.sh dmg --version "$VERSION" --artifact "${{ matrix.artifact }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dshl-${{ matrix.artifact }}
          path: |
            dshl-${{ matrix.artifact }}.zip
            dshl-*-setup.exe
            dshl-*.dmg
            dshl_*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog (previous tag .. this tag)
        id: changelog
        shell: bash
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## Commits"
            echo ""
            git log --encoding=UTF-8 --pretty=format:'- %s (%h)' "$RANGE"
            echo ""
          } > CHANGELOG.md
          {
            echo "changelog<<EOF"
            cat CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: dist/*
          draft: false
          prerelease: false
