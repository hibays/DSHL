name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            ext: .exe
            family: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            ext: ""
            family: linux
            deb_arch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            ext: ""
            family: linux
            deb_arch: arm64
          # Cross-compiled on the arm64 runner (Xcode ships universal SDKs).
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            ext: ""
            family: macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            ext: ""
            family: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cross-compiling Linux aarch64 needs a cross linker + libc headers.
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Resolve version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/dshl${{ matrix.ext }}"
          rm -rf stage && mkdir -p stage
          cp "$BIN" "stage/dshl${{ matrix.ext }}"
          cp dshl.example.toml stage/dshl.toml
          cp README.md stage/
          cp README_en.md stage/

      - name: Package zip
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dshl-${{ matrix.artifact }}"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp stage/* "$STAGE/"
          PY="$(command -v python3 || command -v python)"
          "$PY" - "$STAGE" "dshl-${{ matrix.artifact }}.zip" <<'PY'
          import os, sys, zipfile
          stage, out = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk(stage):
                  for f in files:
                      full = os.path.join(root, f)
                      z.write(full, os.path.relpath(full, stage))
          PY

      - name: Install NSIS (Windows installer)
        if: matrix.family == 'windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package Windows installer (NSIS)
        if: matrix.family == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cp packing/windows/dsh.ico stage/
          if command -v makensis >/dev/null 2>&1; then
            MAKENSIS=makensis
          else
            MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          fi
          # Absolute paths: some makensis builds resolve File/Icon paths
          # against the script's directory instead of the working directory.
          "$MAKENSIS" -V3 \
            "-DSTAGE_DIR=$GITHUB_WORKSPACE/stage" \
            "-DPRODUCT_VERSION=$VERSION" \
            "-DOUTFILE=$GITHUB_WORKSPACE/dshl-${{ matrix.artifact }}-setup.exe" \
            packing/windows/dshl.nsi

      - name: Package Linux installer (.deb)
        if: matrix.family == 'linux'
        shell: bash
        run: |
          bash packing/linux/build-deb.sh \
            "stage/dshl" "$VERSION" "${{ matrix.deb_arch }}" "." "stage/dshl.toml"

      - name: Package macOS installer (.dmg)
        if: matrix.family == 'macos'
        shell: bash
        run: |
          bash packing/macos/build-dmg.sh \
            "stage/dshl" "$VERSION" "." "stage/dshl.toml" "dshl-${{ matrix.artifact }}.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dshl-${{ matrix.artifact }}
          path: |
            dshl-${{ matrix.artifact }}.zip
            dshl-*-setup.exe
            dshl-*.dmg
            dshl_*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog (previous tag .. this tag)
        id: changelog
        shell: bash
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "## Commits"
            echo ""
            git log --pretty=format:'- %s (%h)' "$RANGE"
            echo ""
          } > CHANGELOG.md
          {
            echo "changelog<<EOF"
            cat CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: dist/*
          draft: false
          prerelease: false
